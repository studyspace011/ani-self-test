<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics | Self MCQ Test</title>
    
    <!-- Fonts: Poppins & Noto Nastaliq Urdu -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📈</text></svg>">
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.7.1/dist/chart.min.js"></script>
</head>
<body class="screen active" id="analytics-screen-body">
    <div class="container">
        <h2 class="page-title">
            <i class="fa-solid fa-chart-line"></i> Performance Analytics
        </h2>
        
        <div id="analytics-data-content" class="glass-card">
            <div class="analytics-summary">
                <div class="summary-card">
                    <i class="fa-solid fa-list-check"></i>
                    <h3>Total Attempts</h3>
                    <div class="summary-value" id="total-tests">0</div>
                </div>
                <div class="summary-card">
                    <i class="fa-solid fa-chart-pie"></i>
                    <h3>Average Score</h3>
                    <div class="summary-value" id="average-score">0%</div>
                </div>
                <div class="summary-card">
                    <i class="fa-solid fa-trophy" style="color: #f59e0b;"></i>
                    <h3>Best Score</h3>
                    <div class="summary-value" id="best-score">0%</div>
                </div>
            </div>

            <div class="charts-container">
                <div class="chart-section">
                    <h3><i class="fa-solid fa-book-bookmark" style="color: #38bdf8;"></i> Performance by Subject</h3>
                    <canvas id="subjectPerformanceChart"></canvas>
                </div>
                <div class="chart-section">
                    <h3><i class="fa-solid fa-arrow-trend-up" style="color: #4ade80;"></i> Score Trend (Last 10 Tests)</h3>
                    <canvas id="scoreDistributionChart"></canvas>
                </div>
            </div>
            
            <div class="recent-tests">
                <h3><i class="fa-solid fa-clock-rotate-left" style="color: #a78bfa;"></i> Recent Tests Summary</h3>
                <div id="recent-tests-list" class="history-list"></div>
            </div>
        </div>
        
        <div id="no-history-message" class="glass-card hidden" style="text-align: center; padding: 50px;">
            <i class="fa-solid fa-folder-open" style="font-size: 3rem; color: #64748b; margin-bottom: 15px;"></i>
            <p style="font-size: 1.2rem; color: #94a3b8;">No test records found. Take a test to see your analytics!</p>
        </div>

        <div class="analytics-actions">
            <button id="back-from-analytics" class="secondary-btn">
                <i class="fa-solid fa-house"></i> Back to Home
            </button>
        </div>
    </div>

    <script src="script.js"></script>

    <script>
        window.renderMath = function() {
          if (typeof MathJax !== 'undefined' && MathJax.typesetPromise) {
            MathJax.typesetClear();
            MathJax.typesetPromise();
          } else {
            setTimeout(window.renderMath, 100);
          }
        };
        
        window.MathJax = {
          tex: {
            inlineMath: [['$', '$'], ['\\(', '\\)']],
            processEscapes: true,
            processEnvironments: true
          },
          options: {
            skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
          },
          startup: {
            typeset: false,
            ready: () => {
              MathJax.startup.defaultReady();
              window.renderMath();
            }
          }
        };
    </script>
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</body>
</html>
